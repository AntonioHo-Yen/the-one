[package]
name = "the-one"
version = "0.1.0"
edition = "2024"
description = "the-one (TO1) Protocol - Zero-trust state machine and egress gate framework"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
evdev = "0.12"
zeroize = { version = "1.9.0", features = ["alloc", "derive"] }
thiserror = "2.0.19"
reqwest = "0.13.4"
blake3 = "1.8.5"
getrandom = "0.4.3"
argon2 = "0.5.3"
